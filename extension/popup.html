<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassPilot Importer</title><link rel="stylesheet" href="popup.css"></head><body><main><div class="brand">ClassPilot</div><h1>Schoology Importer</h1><p id="status">Prepare an import from an open Schoology tab first.</p><div id="counts" class="counts hidden"></div><label for="code">One-time ClassPilot code</label><input id="code" maxlength="32" autocomplete="off" placeholder="Paste code"><button id="import">Import to ClassPilot</button><div id="message" class="message"></div><p class="note">The extension sends only the prepared course and assignment data. It does not ask for your Schoology login details.</p></main><script src="popup.js"></script></body></html>
